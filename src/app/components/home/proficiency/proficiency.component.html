<section class="section proficiency" id='proficiency'>
    <div class="container">
        <div class="section-box">
            <div data-aos="fade-up" data-aos-duration="1000">
                <h3 class="section-title">
                    <span class='n-section-title'>04.</span> {{ 'label.proficiency' | translate }}
                </h3>
            </div>

            <div class="skills-grid">
                @for (category of categories(); track category.titleKey) {
                    <div class="skill-category" data-aos="fade-up" data-aos-duration="1000">
                        <h5 class="skill-category-title">{{ category.titleKey | translate }}</h5>
                        <ul class="skills-list">
                            @for (skill of category.skills; track skill.name) {
                                <li class="skill-element">
                                    <span class="skill-name">{{ skill.name }}</span>
                                    <span class="skill-stars" [attr.aria-label]="skill.rating + '/5'">
                                        @for (star of stars; track star) {
                                            <i
                                                class="fa-star"
                                                [class.fas]="star <= skill.rating"
                                                [class.far]="star > skill.rating"
                                            ></i>
                                        }
                                    </span>
                                </li>
                            }
                        </ul>
                    </div>
                }
            </div>
        </div>
    </div>
</section>
